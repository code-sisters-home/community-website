name: Deploy dev
on:
  push:
    branches: [ dev ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push (dev)
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/code-sisters-home/community-website:dev
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://codesisters.net

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # sudo docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_TOKEN }} || true
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            sudo mkdir -p /var/www/codesisters
            cd /var/www/codesisters
            sudo docker compose pull web-dev
            sudo docker compose up -d web-dev
            sudo docker image prune -f
