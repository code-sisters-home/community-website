name: Build
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev/prod)"
        required: true
        default: "dev"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push (${{ github.event.inputs.env }})
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/code-sisters-home/community-website:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://codesisters.net
