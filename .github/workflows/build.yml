name: Build image

on:
  push:
    branches: [ dev, main ]

  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev/prod)"
        required: true
        default: "dev"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      ENV: ${{ github.event.inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/code-sisters-home/community-website:${{ env.ENV }}
            ghcr.io/code-sisters-home/community-website:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://codesisters.net
